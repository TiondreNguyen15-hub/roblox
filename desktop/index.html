<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Blue Menu</title>
<style>
:root{color-scheme:dark;--blue:#2788ff;--glow:rgba(39,136,255,.16)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 100%,#122a46,transparent 65%),#080c14;color:#f4f8ff;font-family:Segoe UI,Arial,sans-serif;padding:28px}
main{width:min(100%,400px);background:#0d141f;border:1px solid #22364e;border-radius:28px;padding:38px 30px 24px;box-shadow:0 24px 90px #0006;animation:enter .45s ease-out}
.mark{width:44px;height:44px;border:1px solid #2865a4;background:#102c4b;color:#69afff;display:grid;place-items:center;border-radius:14px;font-size:23px;margin:0 auto 22px}
header{text-align:center}h1{font-size:29px;letter-spacing:2px;margin:0 0 10px}p{color:#91a4be;font-size:14px;line-height:1.7;margin:0 0 28px}.eyebrow{font-size:10px;letter-spacing:3px;color:#6091c4;text-align:center;margin:28px 0 0}
button{font:600 14px Segoe UI,Arial,sans-serif;color:#f4f8ff;width:100%;padding:18px;border:1px solid #26394f;border-radius:15px;background:#172337;cursor:pointer;transition:background .16s,transform .16s,box-shadow .16s;margin:0 0 12px;letter-spacing:1px}
button:hover{background:#22354e;transform:translateY(-2px)}button:focus-visible,input:focus-visible{outline:3px solid #98c9ff;outline-offset:4px}button.primary{background:var(--blue);border-color:var(--blue);box-shadow:0 8px 25px var(--glow)}button.primary:hover{filter:brightness(1.12)}button:last-child{margin-bottom:0}[hidden]{display:none!important}.detail{min-height:110px;text-align:center;padding:12px 0}.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 34px;color:#c4d2e5;font-size:14px}input{accent-color:var(--blue);width:22px;height:22px;cursor:pointer}.status{display:inline-block;color:#71b2ff;background:#102944;border:1px solid #244e78;border-radius:30px;padding:7px 13px;font-size:11px;letter-spacing:1px;margin-bottom:22px}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}body.reduced *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<main>
<header><div class="mark" aria-hidden="true">◇</div><h1 id="title">BLUE MENU</h1><p id="subtitle">Ready when you are.</p></header>
<section id="home" aria-label="Main menu"><button class="primary" data-view="play">PLAY &nbsp; →</button><button data-view="settings">SETTINGS</button><button data-view="credits">CREDITS</button></section>
<section id="play" hidden aria-label="Welcome"><div class="detail"><span class="status">YOU’RE IN</span><p>Welcome to your desktop menu.<br>Connect your game to this screen when it’s ready.</p></div><button class="primary" data-view="home">BACK TO MENU</button></section>
<section id="settings" hidden aria-label="Settings"><label class="setting" for="motion">Reduce animations<input id="motion" type="checkbox"></label><p>Your preference is saved on this computer.</p><button class="primary" data-view="home">BACK</button></section>
<section id="credits" hidden aria-label="Credits"><div class="detail"><p>Blue Menu<br>A black and blue desktop experience.<br>Built with Electron.</p></div><button class="primary" data-view="home">BACK</button></section>
<footer class="eyebrow">YOUR NEXT ADVENTURE</footer>
</main>
<script>
const views=['home','play','settings','credits'];
const headings={home:['BLUE MENU','Ready when you are.'],play:['WELCOME','Your next adventure starts here.'],settings:['SETTINGS','Make yourself comfortable.'],credits:['CREDITS','Thanks for stopping by.']};
function show(name){
  for(const id of views)document.getElementById(id).hidden=id!==name;
  document.getElementById('title').textContent=headings[name][0];
  document.getElementById('subtitle').textContent=headings[name][1];
  document.getElementById(name).querySelector('button, input').focus();
}
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>show(button.dataset.view)));
const motion=document.getElementById('motion');
try{motion.checked=localStorage.getItem('reduceMotion')==='true';}catch{}
document.body.classList.toggle('reduced',motion.checked);
motion.addEventListener('change',()=>{document.body.classList.toggle('reduced',motion.checked);try{localStorage.setItem('reduceMotion',String(motion.checked));}catch{}});
document.addEventListener('keydown',event=>{if(event.key==='Escape')show('home');});
</script>
</body>
</html>
